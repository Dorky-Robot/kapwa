[package]
name = "kapwa"
version = "0.2.0"
edition = "2021"
description = "What participants owe each other: per-writer append-only logs, pull replication, a fold, a board"
license = "MIT OR Apache-2.0"

[dependencies]
axum = "0.7"
axum-extra = { version = "0.9", features = ["cookie-private"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs"] }
tower-http = { version = "0.5", features = ["trace"] }

# rustls everywhere: no OpenSSL, no libcrypto, one static file
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json"] }
openidconnect = { version = "3", default-features = false, features = ["reqwest", "rustls-tls"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
maud = "0.26"
constant_time_eq = "0.3"
base64 = "0.22"
cookie = "0.18"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
